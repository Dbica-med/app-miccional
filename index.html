<style>
@font-face{font-family:'EB Garamond';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/eb-garamond-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/eb-garamond-latin-600-normal.woff2) format('woff2')}

/* Layout: duas superfícies. App dos pais = coluna de celular (marca azul-marinho e dourado). Painel do médico = ferramenta densa, largura total. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#F7F8FB;
  --ink:#0D2340; --ink2:#46546C; --muted:#78859A;
  --line:#DCE1EA; --grid:#E4E8EF; --axis:#C3CBD8;
  --brand:#0D2340; --hdr:#0D2340; --hdr-ink:#FFFFFF; --gold:#C8A46A; --gold-ink:#7A5B22; --gold-wash:#F6EEDD;
  --btn:#0D2340; --btn-ink:#FFFFFF; --sel:#E6ECF6; --sel-line:#0D2340;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --info:#2a78d6;
  --c-noite:#2a78d6; --c-dia:#eb6834; --c-int:#1baf7a; --med:#0D2340;
  --shadow:0 1px 2px rgba(13,35,64,.06),0 6px 20px rgba(13,35,64,.06);
  --serif:'EB Garamond',Georgia,'Times New Roman',serif; --sans:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1424; --surface:#12203A; --surface2:#172846;
  --ink:#EAEFF7; --ink2:#B4C0D4; --muted:#8190A8;
  --line:#26395A; --grid:#22344F; --axis:#34496A;
  --hdr:#0F2848; --btn:#C8A46A; --btn-ink:#0D2340; --sel:#1C3156; --sel-line:#C8A46A; --gold-ink:#E3C48C; --gold-wash:#2A2A2E;
  --c-noite:#3987e5; --c-dia:#d95926; --c-int:#199e70; --med:#9DB4D8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1424; --surface:#12203A; --surface2:#172846;
  --ink:#EAEFF7; --ink2:#B4C0D4; --muted:#8190A8;
  --line:#26395A; --grid:#22344F; --axis:#34496A;
  --hdr:#0F2848; --btn:#C8A46A; --btn-ink:#0D2340; --sel:#1C3156; --sel-line:#C8A46A; --gold-ink:#E3C48C; --gold-wash:#2A2A2E;
  --c-noite:#3987e5; --c-dia:#d95926; --c-int:#199e70; --med:#9DB4D8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.005em;text-wrap:balance}
h1{font-size:26px;line-height:1.15} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
a{color:inherit}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* barra do protótipo */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding:10px 0 8px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;max-width:1120px;margin:0 auto}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-wash);padding:4px 9px;border-radius:99px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--ink2)}
/* ===== app dos pais ===== */
.phone{max-width:430px;margin:6px auto 0;background:var(--bg);border-radius:30px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;min-height:720px;position:relative;display:flex;flex-direction:column}
@media (max-width:520px){.phone{border-radius:0;border:0;box-shadow:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-inline-end:calc(-1*max(16px,env(safe-area-inset-right,0px)))}}
.hdr{background:var(--hdr);color:var(--hdr-ink);padding:14px 18px;display:flex;align-items:center;gap:12px}
.hdr svg{width:34px;height:auto;flex:none}
.hdr .nm{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.1}
.hdr .sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:2px}
.hdr .who{margin-left:auto;font-size:12px;color:#C9D3E4;text-align:right}
.body{padding:18px;display:flex;flex-direction:column;gap:14px;flex:1}
.foot{padding:14px 18px 20px;font-size:12px;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
.foot a{color:var(--gold-ink);font-weight:600;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.flat{box-shadow:none}
.lead{color:var(--ink2);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;padding:13px 18px;font-weight:700;background:var(--btn);color:var(--btn-ink);min-height:48px;font-size:15px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#0D2340}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px}
.in:focus{outline:2px solid var(--gold);border-color:transparent}
.field{display:flex;flex-direction:column;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:600;min-height:40px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-line)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--brand)}
.term{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--ink2);background:var(--surface2)}
.term p{margin:0 0 7px}
.note{font-size:12.5px;color:var(--ink2);background:var(--gold-wash);border-radius:12px;padding:10px 12px}
.menu{display:flex;flex-direction:column;gap:10px}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:72px}
.mi .t{font-weight:700;font-size:16px}
.mi .d{font-size:13px;color:var(--ink2);margin-top:1px}
.mi .ic{width:44px;height:44px;border-radius:12px;background:var(--sel);display:grid;place-items:center;flex:none;font-size:22px}
.sem{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px 4px 6px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.sem i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff;font-style:normal;font-size:12px;line-height:1}
.sem.g i{background:var(--good)} .sem.y i{background:var(--warn);color:#3a2a00} .sem.r i{background:var(--crit)} .sem.n i{background:var(--muted)}
.back{background:none;border:0;padding:6px 0;font-weight:700;color:var(--ink2);display:inline-flex;gap:6px;align-items:center;min-height:36px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sym{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 8px;min-height:104px;font-weight:700;font-size:13px;text-align:center}
.sym b{font-size:34px;line-height:1;font-weight:400}
.sym[aria-pressed="true"]{border-color:var(--sel-line);background:var(--sel)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;font-weight:700;text-align:center;color:var(--muted);text-transform:uppercase;padding:2px 0}
.day{aspect-ratio:1/1.12;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink2);min-width:0}
.day b{font-size:18px;line-height:1;font-weight:400}
.day .fl{font-size:9px;line-height:1;min-height:9px}
.day.off{opacity:.38}
.day.today{border:2px solid var(--gold)}
.day.miss{background:var(--surface2)}
.day.hit{cursor:pointer}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12.5px;color:var(--ink2)}
.sheetbg{position:fixed;inset:0;background:rgba(5,12,25,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:430px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;line-height:1}
.stepper output{min-width:44px;text-align:center;font-size:20px;font-weight:700}
.qrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow .q{font-size:14px;font-weight:600;flex:1}
.q small{display:block;font-weight:400;color:var(--muted);font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;box-shadow:var(--shadow)}
#tip{position:fixed;z-index:95;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;max-width:240px;line-height:1.35;display:none}
/* ===== painel do médico ===== */
.doc{max-width:1120px;margin:6px auto 0;display:flex;flex-direction:column;gap:16px}
.dhdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhdr svg{width:34px;height:auto;flex:none}
.dhdr .nm{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1}
.dhdr .sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;line-height:1.05;font-weight:700}
.kpi span{font-size:12.5px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 8px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill u{width:9px;height:9px;display:inline-block;background:var(--muted);border-radius:50%}
.pill.warn u{background:var(--warn)} .pill.crit u{background:var(--crit);border-radius:2px;transform:rotate(45deg)} .pill.ok u{background:var(--good)} .pill.info u{background:var(--info);border-radius:2px} .pill.gray u{background:var(--muted)}
.mod{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--sel);color:var(--ink);margin-right:3px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.plist tr{cursor:pointer}
.plist tr:hover td{background:var(--surface2)}
.charttitle{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
.charttitle h3{font-size:16px}
.charttitle small{color:var(--muted);font-size:12.5px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox text{fill:var(--muted);font:11px var(--sans)}
.chartbox text.k{fill:var(--ink2)}
.stat{display:flex;flex-direction:column;gap:2px;min-width:110px}
.stat b{font-size:28px;line-height:1.05}
.stat span{font-size:12.5px;color:var(--ink2)}
.wk{display:grid;grid-template-columns:34px 1fr 48px;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.wk i{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--c-noite)}
.bar{height:14px;background:var(--grid);border-radius:7px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--c-noite);border-radius:7px 0 0 7px}
.flag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--gold-wash);color:var(--gold-ink)}
textarea.msg{width:100%;min-height:130px;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.5;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:700}
@media (max-width:520px){.seg{max-width:100%}.seg button{padding:7px 8px;font-size:12px}.proto .seg{flex-wrap:wrap;justify-content:center}}
.hdr .nm,.dhdr .nm{text-transform:uppercase;width:max-content;white-space:nowrap}
.hdr .nm{font-size:17px}.hdr .sub,.dhdr .sub{width:max-content;white-space:nowrap}
/* iPhone: evita zoom automático ao tocar em campos e rolagem lateral */
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}
.in,input,select,textarea{font-size:16px}
.field{min-width:0}
input[type=date],input[type=time],input[type=number]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}

<script>

 return '<div class="hdr">'+MARK+'<div><div class="nm">Dr. Domingos Bica</div><div class="sub">Urologista Pediátrico</div></div>'+sub+'</div>';

/* ---------- rede ---------- */
async function api(req){
 if(!API_URL||API_URL.indexOf('COLE')>=0)return{ok:false,err:'config'};
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),30000);
 try{
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(req),redirect:'follow',signal:ctl.signal});
  return await r.json();
 }catch(e){return{ok:false,err:'rede'}}finally{clearTimeout(tm)}
}
function queue(a,d){S.outbox.push({eid:uid(),a:a,d:d});save();flush()}
let flushing=false;
async function flush(){
 if(flushing||!S.token||!S.outbox.length||S.authBad)return;
 if(navigator.onLine===false)return;
 flushing=true;
 try{
  for(let guard=0;guard<20&&S.outbox.length;guard++){
   const batch=S.outbox.slice(0,40);
   const r=await api({a:'sync',c:S.code,t:S.token,e:batch});
   if(r.ok){
    const gone=new Set((r.done||[]).concat(r.bad||[]));
    S.outbox=S.outbox.filter(e=>!gone.has(e.eid));
    if(r.config)applyCfg(r.config);
    save();render();
   }else{if(r.err==='auth'){S.authBad=true;save();render()}break}
  }
 }finally{flushing=false}
}
async function refresh(){
 if(!S.token)return;
 const r=await api({a:'config',c:S.code,t:S.token});
 if(r.ok){applyCfg(r.config);save()}else if(r.err==='auth'){S.authBad=true}
 render();flush();
}

  o.busy=false;
  if(!r.ok){
   o.err=({dados:'O código ou a data de nascimento não conferem. Confira com o consultório.',bloqueado:'Muitas tentativas. Tente novamente daqui a 1 hora.',termo:'O termo mudou. Feche e abra o aplicativo de novo.',codigo:'Código inválido. Use as iniciais e o ano de nascimento, como no exemplo.',rede:'Sem conexão com a internet. Tente de novo.',config:'O aplicativo ainda não foi configurado.',ocupado:'O serviço está ocupado. Tente de novo em instantes.'})[r.err]||'Não foi possível entrar. Tente de novo.';
   render();return 'norender';
  }
  S.code=norm(o.code);S.token=r.token;S.papel=o.papel;S.authBad=false;S.p.screen='load';S.ob=blankOb();
  applyCfg(r.config);save();toTop();
 },
 refresh(){S.busy=true;render();refresh().then(()=>{S.busy=false;render()});return 'norender'},
 dxstart(){
  const d=S.dx;
  if(d.ativo||[0,6].includes(TODAY.getDay())||d.ack){if(!d.ativo){d.id='d'+uid();d.data=I(TODAY);d.ativo=true}S.p.screen='diary';save();toTop()}
  else S.p.sheet={v:'rule'}},
 ruleok(){const d=S.dx;S.p.sheet=null;d.id='d'+uid();d.data=I(TODAY);d.ativo=true;S.p.screen='diary';save();toTop()},
 dxfromtrat(){S.p.screen='dx';save();toTop()},
 sheet(d){S.p.sheet=d.v?{v:d.v}:null;if(d.v==='mic')S.draft2={h:now(),v:'',nm:false,u:'ausente',p:'nenhuma',o:''};if(d.v==='liq')S.draft3={h:now(),v:0,t:'Água',vv:''};if(d.v==='fim')S.dx.fim={q:'',g:'',m:''}},
 night(d){openNight(d.v)},
 dr(d){S.draft[d.k]=d.v},
 drf(d){const f=S.draft.f,i=f.indexOf(d.v);i<0?f.push(d.v):f.splice(i,1)},
 drp(d){S.draft.por=d.v},
 nstep(d){S.p.sheet.step=Number(d.v)},
 savenight(){
  const k=S.p.sheet.k,dr=S.draft,casa=dr.who==='pai'?'P':'M';
  const f=dr.f.filter(x=>x!=='med').concat(dr.rem==='nao'?['med']:[]);
  S.nights[k]={h:casa,s:dr.s,f,por:dr.por,al:dr.al||'',rem:dr.rem,who:dr.who};
  queue('night',{data:k,casa,s:dr.s,por:dr.por,rem:dr.rem,al:dr.al||'',flags:f,quem:dr.who||S.papel});
  S.p.sheet=null;save()},
 cm(d){let{y,m}=S.cal;m+=Number(d.v);if(m<0){m=11;y--}if(m>11){m=0;y++}S.cal={y,m}},
 d2(d){S.draft2[d.k]=d.v},
 d3(d){S.draft3.v=Number(d.v);S.draft3.vv=''},
 d3t(d){S.draft3.t=d.v},
 savemic(){const m=S.draft2,dx=S.dx,ml=m.nm?0:Math.round(Number(m.v)||0);
  dx.mic.push([m.h,ml,m.u,m.p,m.o||'']);
  queue('mic',{diario:dx.id,data:dx.data,hora:m.h,ml,urg:m.u,perda:m.p,obs:m.o||''});S.p.sheet=null;save()},
 saveliq(){const v=Math.round(Number(S.draft3.vv)||S.draft3.v);if(!v)return 'norender';const dx=S.dx;
  dx.liq.push([S.draft3.h,v,S.draft3.t]);
  queue('liq',{diario:dx.id,data:dx.data,hora:S.draft3.h||'',ml:v,tipo:S.draft3.t});S.p.sheet=null;save()},
 fim(d){S.dx.fim.q=d.v},
 fimok(){const dx=S.dx,f=dx.fim,tipo=S.cfg&&S.cfg.dx?S.cfg.dx.tipo:'inicial';
  queue('fim',{diario:dx.id,data:dx.data,tipo,sr:f.q==='sim'?'sim':'nao',g:f.g,m:f.m});
  Object.assign(S.dx,newDx());S.p.sheet=null;S.p.screen=(S.cfg&&S.cfg.fase==='trat')?'menu':'dx';save();toTop()},
 wb(d){S.ws.bris=Number(d.v)},
 savewk(){const w=S.ws,k=I(add(monday(TODAY),-7));
  S.weeks[k]={dias:w.dias,esc:w.av+w.sem,av:w.av,sem:w.sem,urg:w.urg,troca:w.troca,regra:w.regra,evac:w.evac,bris:w.bris,fecal:w.fecal};
  queue('week',{semana:k,dias:w.dias,esc:w.av+w.sem,av:w.av,sem:w.sem,urg:w.urg,troca:w.troca,regra:w.regra,evac:w.evac,bris:w.bris,fecal:w.fecal});
  S.p.screen='menu';save();toTop()},
 addnote(){const t=(S.nt||'').trim();if(!t)return 'norender';S.notes.unshift([FY(TODAY),t]);queue('note',{data:I(TODAY),texto:t});S.nt=''},
 st(d){const v=Math.max(Number(d.min),Math.min(Number(d.max),Number(get(d.p))+Number(d.d)));set(d.p,v);document.querySelectorAll('output[data-bind="'+d.p+'"]').forEach(o=>o.textContent=v);save();return 'norender'},
 sheetbg(d,e){if(e.target.classList.contains('sheetbg')){S.p.sheet=null}else return 'norender'},
 sairok(){try{localStorage.removeItem(KEY)}catch(e){}init();S.p.screen='onb';render();toTop()}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
 const fn=A[el.dataset.a];if(!fn)return;
 if(el.classList.contains('sheetbg')&&e.target!==el)return;
 const r=fn(el.dataset,e);
 if(r&&typeof r.then==='function'){r.then(x=>{if(x!=='norender')render()});return}
 if(r==='norender')return;
 render();
});
function onField(e){
 const el=e.target;
 if(el.dataset.i){set(el.dataset.i,el.value);if(el.dataset.i==='ob.code'||el.dataset.i==='ob.dob'){S.ob.err=''}
  const u=el.dataset.u;
  if(u==='ob'){const g=document.getElementById('ob-go');if(g)g.disabled=!obValid()||S.ob.busy;const n=document.getElementById('ob-norm');if(n)n.innerHTML=norm(S.ob.code)?'Código lido: <b>'+norm(S.ob.code)+'</b>':'Maiúsculas e minúsculas não importam.'}
  save();
 }
 if(el.dataset.c&&e.type==='change'){
  set(el.dataset.c,el.checked);
  if(el.dataset.c==='p.share')queue('share',{v:el.checked});
  save();render();
 }
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
window.addEventListener('online',()=>flush());
document.addEventListener('visibilitychange',()=>{if(!document.hidden){TODAY=mkToday();refresh()}});
setInterval(()=>{if(S&&S.outbox.length)flush()},60000);
init();render();
if(S.token)refresh();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

</script></body></html>
