<style>
@font-face{font-family:'EB Garamond';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/eb-garamond-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/eb-garamond-latin-600-normal.woff2) format('woff2')}

/* Layout: duas superfícies. App dos pais = coluna de celular (marca azul-marinho e dourado). Painel do médico = ferramenta densa, largura total. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#F7F8FB;
  --ink:#0D2340; --ink2:#46546C; --muted:#78859A;
  --line:#DCE1EA; --grid:#E4E8EF; --axis:#C3CBD8;
  --brand:#0D2340; --hdr:#0D2340; --hdr-ink:#FFFFFF; --gold:#C8A46A; --gold-ink:#7A5B22; --gold-wash:#F6EEDD;
  --btn:#0D2340; --btn-ink:#FFFFFF; --sel:#E6ECF6; --sel-line:#0D2340;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --info:#2a78d6;
  --c-noite:#2a78d6; --c-dia:#eb6834; --c-int:#1baf7a; --med:#0D2340;
  --shadow:0 1px 2px rgba(13,35,64,.06),0 6px 20px rgba(13,35,64,.06);
  --serif:'EB Garamond',Georgia,'Times New Roman',serif; --sans:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1424; --surface:#12203A; --surface2:#172846;
  --ink:#EAEFF7; --ink2:#B4C0D4; --muted:#8190A8;
  --line:#26395A; --grid:#22344F; --axis:#34496A;
  --hdr:#0F2848; --btn:#C8A46A; --btn-ink:#0D2340; --sel:#1C3156; --sel-line:#C8A46A; --gold-ink:#E3C48C; --gold-wash:#2A2A2E;
  --c-noite:#3987e5; --c-dia:#d95926; --c-int:#199e70; --med:#9DB4D8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1424; --surface:#12203A; --surface2:#172846;
  --ink:#EAEFF7; --ink2:#B4C0D4; --muted:#8190A8;
  --line:#26395A; --grid:#22344F; --axis:#34496A;
  --hdr:#0F2848; --btn:#C8A46A; --btn-ink:#0D2340; --sel:#1C3156; --sel-line:#C8A46A; --gold-ink:#E3C48C; --gold-wash:#2A2A2E;
  --c-noite:#3987e5; --c-dia:#d95926; --c-int:#199e70; --med:#9DB4D8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.005em;text-wrap:balance}
h1{font-size:26px;line-height:1.15} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
a{color:inherit}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* barra do protótipo */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding:10px 0 8px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;max-width:1120px;margin:0 auto}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-wash);padding:4px 9px;border-radius:99px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--ink2)}
/* ===== app dos pais ===== */
.phone{max-width:430px;margin:6px auto 0;background:var(--bg);border-radius:30px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;min-height:720px;position:relative;display:flex;flex-direction:column}
@media (max-width:520px){.phone{border-radius:0;border:0;box-shadow:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-inline-end:calc(-1*max(16px,env(safe-area-inset-right,0px)))}}
.hdr{background:var(--hdr);color:var(--hdr-ink);padding:14px 18px;display:flex;align-items:center;gap:12px}
.hdr svg{width:34px;height:auto;flex:none}
.hdr .nm{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.1}
.hdr .sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:2px}
.hdr .who{margin-left:auto;font-size:12px;color:#C9D3E4;text-align:right}
.body{padding:18px;display:flex;flex-direction:column;gap:14px;flex:1}
.foot{padding:14px 18px 20px;font-size:12px;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
.foot a{color:var(--gold-ink);font-weight:600;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.flat{box-shadow:none}
.lead{color:var(--ink2);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;padding:13px 18px;font-weight:700;background:var(--btn);color:var(--btn-ink);min-height:48px;font-size:15px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#0D2340}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px}
.in:focus{outline:2px solid var(--gold);border-color:transparent}
.field{display:flex;flex-direction:column;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:600;min-height:40px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-line)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--brand)}
.term{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--ink2);background:var(--surface2)}
.term p{margin:0 0 7px}
.note{font-size:12.5px;color:var(--ink2);background:var(--gold-wash);border-radius:12px;padding:10px 12px}
.menu{display:flex;flex-direction:column;gap:10px}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:72px}
.mi .t{font-weight:700;font-size:16px}
.mi .d{font-size:13px;color:var(--ink2);margin-top:1px}
.mi .ic{width:44px;height:44px;border-radius:12px;background:var(--sel);display:grid;place-items:center;flex:none;font-size:22px}
.sem{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px 4px 6px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.sem i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff;font-style:normal;font-size:12px;line-height:1}
.sem.g i{background:var(--good)} .sem.y i{background:var(--warn);color:#3a2a00} .sem.r i{background:var(--crit)} .sem.n i{background:var(--muted)}
.back{background:none;border:0;padding:6px 0;font-weight:700;color:var(--ink2);display:inline-flex;gap:6px;align-items:center;min-height:36px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sym{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 8px;min-height:104px;font-weight:700;font-size:13px;text-align:center}
.sym b{font-size:34px;line-height:1;font-weight:400}
.sym[aria-pressed="true"]{border-color:var(--sel-line);background:var(--sel)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;font-weight:700;text-align:center;color:var(--muted);text-transform:uppercase;padding:2px 0}
.day{aspect-ratio:1/1.12;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink2);min-width:0}
.day b{font-size:18px;line-height:1;font-weight:400}
.day .fl{font-size:9px;line-height:1;min-height:9px}
.day.off{opacity:.38}
.day.today{border:2px solid var(--gold)}
.day.miss{background:var(--surface2)}
.day.hit{cursor:pointer}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12.5px;color:var(--ink2)}
.sheetbg{position:fixed;inset:0;background:rgba(5,12,25,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:430px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;line-height:1}
.stepper output{min-width:44px;text-align:center;font-size:20px;font-weight:700}
.qrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow .q{font-size:14px;font-weight:600;flex:1}
.q small{display:block;font-weight:400;color:var(--muted);font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;box-shadow:var(--shadow)}
#tip{position:fixed;z-index:95;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;max-width:240px;line-height:1.35;display:none}
/* ===== painel do médico ===== */
.doc{max-width:1120px;margin:6px auto 0;display:flex;flex-direction:column;gap:16px}
.dhdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhdr svg{width:34px;height:auto;flex:none}
.dhdr .nm{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1}
.dhdr .sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;line-height:1.05;font-weight:700}
.kpi span{font-size:12.5px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 8px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill u{width:9px;height:9px;display:inline-block;background:var(--muted);border-radius:50%}
.pill.warn u{background:var(--warn)} .pill.crit u{background:var(--crit);border-radius:2px;transform:rotate(45deg)} .pill.ok u{background:var(--good)} .pill.info u{background:var(--info);border-radius:2px} .pill.gray u{background:var(--muted)}
.mod{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--sel);color:var(--ink);margin-right:3px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.plist tr{cursor:pointer}
.plist tr:hover td{background:var(--surface2)}
.charttitle{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
.charttitle h3{font-size:16px}
.charttitle small{color:var(--muted);font-size:12.5px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox text{fill:var(--muted);font:11px var(--sans)}
.chartbox text.k{fill:var(--ink2)}
.stat{display:flex;flex-direction:column;gap:2px;min-width:110px}
.stat b{font-size:28px;line-height:1.05}
.stat span{font-size:12.5px;color:var(--ink2)}
.wk{display:grid;grid-template-columns:34px 1fr 48px;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.wk i{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--c-noite)}
.bar{height:14px;background:var(--grid);border-radius:7px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--c-noite);border-radius:7px 0 0 7px}
.flag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--gold-wash);color:var(--gold-ink)}
textarea.msg{width:100%;min-height:130px;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.5;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:700}
@media (max-width:520px){.seg{max-width:100%}.seg button{padding:7px 8px;font-size:12px}.proto .seg{flex-wrap:wrap;justify-content:center}}
.hdr .nm,.dhdr .nm{text-transform:uppercase;width:max-content;white-space:nowrap}
.hdr .nm{font-size:17px}.hdr .sub,.dhdr .sub{width:max-content;white-space:nowrap}
/* iPhone: evita zoom automático ao tocar em campos e rolagem lateral */
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}
.in,input,select,textarea{font-size:16px}
.field{min-width:0}
input[type=date],input[type=time],input[type=number]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}

.lang{display:flex;justify-content:flex-end;gap:6px;padding:8px 16px 0;flex-wrap:wrap}
.lang button{font:inherit;font-size:12px;min-height:30px;padding:4px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-line);color:var(--ink);font-weight:700}
.mi.locked{opacity:.55;cursor:default;background:var(--surface2)}
.mi.locked .lock{font-size:16px;flex:none}

a.btn{text-decoration:none}

'ob.title':['Bem-vindos','Welcome','Bienvenue'],
'ob.intro':['Este é o aplicativo de acompanhamento miccional, para o tratamento dos problemas de xixi (distúrbios miccionais). Com ele, o tratamento é acompanhado com mais rigor e controle entre as consultas, e as condutas podem ser ajustadas com mais segurança. Use o código que o consultório enviou pelo WhatsApp.','This is the voiding follow-up app, for treating urinary problems in children (voiding disorders). It lets treatment be followed more closely between visits, so that decisions can be adjusted more safely. Use the code the office sent you on WhatsApp.','Voici l’application de suivi mictionnel, pour le traitement des problèmes urinaires de l’enfant (troubles mictionnels). Elle permet de suivre le traitement avec plus de rigueur entre les consultations et d’ajuster les décisions plus sûrement. Utilisez le code envoyé par le cabinet sur WhatsApp.'],
'ob.code':['Código da criança','Child’s code','Code de l’enfant'],'ob.read':['Código lido: ','Code read: ','Code lu : '],'ob.case':['Maiúsculas e minúsculas não importam.','Upper and lower case do not matter.','Majuscules et minuscules n’ont pas d’importance.'],
'ob.dob':['Data de nascimento da criança','Child’s date of birth','Date de naissance de l’enfant'],'ob.dobh':['Serve só para conferir o código. Não fica guardada.','Used only to check the code. It is not stored.','Sert uniquement à vérifier le code. Elle n’est pas conservée.'],
'ob.sx':['A criança é','The child is','L’enfant est'],'ob.M':['Menino','Boy','Garçon'],'ob.F':['Menina','Girl','Fille'],
'ob.who':['Quem usa este aparelho','Who uses this device','Qui utilise cet appareil'],'ob.mae':['Mãe','Mother','Mère'],'ob.pai':['Pai','Father','Père'],'ob.outro':['Outro responsável','Other guardian','Autre responsable légal'],'ob.adol':['Sou o adolescente','I am the teenager','Je suis l’adolescent(e)'],
'ob.cas':['A criança divide o tempo entre duas casas (guarda compartilhada). Cada responsável usa o próprio celular, com o mesmo código.','The child splits time between two homes (shared custody). Each guardian uses their own phone, with the same code.','L’enfant partage son temps entre deux domiciles (garde partagée). Chaque responsable utilise son propre téléphone, avec le même code.'],
'ob.phase':['Em que fase estão?','Which stage are you at?','À quelle étape en êtes-vous ?'],'ob.inv':['Em investigação','Under evaluation','En cours d’évaluation'],'ob.trat':['Já iniciou tratamento com o Dr. Domingos Bica','Already started treatment with Dr. Domingos Bica','A déjà commencé le traitement avec le Dr Domingos Bica'],
'ob.why':['O que traz vocês ao consultório?','What brings you to the office?','Qu’est-ce qui vous amène au cabinet ?'],'ob.mn':['Xixi na cama durante a noite (enurese)','Wetting the bed at night (enuresis)','Pipi au lit la nuit (énurésie)'],
'ob.md':['Perdas, urgência ou outros problemas para urinar durante o dia','Leaks, urgency or other problems urinating during the day','Fuites, urgences ou autres problèmes pour uriner pendant la journée'],
'ob.nd':['O Dr. Domingos pediu quantos diários miccionais?','How many voiding diaries did Dr. Domingos ask for?','Combien de journaux mictionnels le Dr Domingos a-t-il demandés ?'],
'ob.term':['Termo de consentimento','Consent form','Formulaire de consentement'],
'ob.t1':['<b>1. Finalidade.</b> Este aplicativo registra diários e o calendário do xixi, para acompanhar a evolução do tratamento com maior rigor e controle e orientar as decisões do Dr. Domingos Bica.','<b>1. Purpose.</b> This app records voiding diaries and the pee calendar, to follow the progress of treatment more closely and to guide Dr. Domingos Bica’s decisions.','<b>1. Finalité.</b> Cette application enregistre les journaux mictionnels et le calendrier pipi, pour suivre l’évolution du traitement avec plus de rigueur et orienter les décisions du Dr Domingos Bica.'],
'ob.t2':['<b>2. Dados.</b> Apenas o código da criança e os registros lançados. Não há nome, endereço, telefone, documento nem qualquer vínculo direto com a identidade. O código só é associado à criança dentro do sistema de prontuário do médico, onde ficam todos os dados médicos e de identificação, e que são tratados conforme a LGPD.','<b>2. Data.</b> Only the child’s code and the records entered. There is no name, address, phone number, ID document or any direct link to identity. The code is linked to the child only inside the doctor’s medical record system, where all medical and identification data are kept and handled in accordance with the LGPD (Brazil’s data protection law).','<b>2. Données.</b> Uniquement le code de l’enfant et les enregistrements saisis. Il n’y a ni nom, ni adresse, ni téléphone, ni document, ni aucun lien direct avec l’identité. Le code n’est associé à l’enfant que dans le système de dossier médical du médecin, où se trouvent toutes les données médicales et d’identification, traitées conformément à la LGPD (loi brésilienne sur la protection des données).'],
'ob.t3':['<b>3. Acesso.</b> Somente o Dr. Domingos Bica. Os registros não são enviados nem divulgados a mais ninguém.','<b>3. Access.</b> Only Dr. Domingos Bica. The records are not sent or disclosed to anyone else.','<b>3. Accès.</b> Uniquement le Dr Domingos Bica. Les enregistrements ne sont ni envoyés ni divulgués à personne d’autre.'],
'ob.t4':['<b>4. Armazenamento.</b> Planilha em nuvem protegida, só com o código e os registros.','<b>4. Storage.</b> A protected cloud spreadsheet, holding only the code and the records.','<b>4. Stockage.</b> Feuille de calcul en nuage protégée, avec uniquement le code et les enregistrements.'],
'ob.t5':['<b>5. Duração e uso estatístico.</b> O consentimento vale durante o acompanhamento. Ao final ou interrupção do tratamento, os registros são anonimizados, sem o código, e usados apenas para estatística e pesquisa médica. Se preferir a exclusão, solicite pelo consultório.','<b>5. Duration and statistical use.</b> Consent applies during follow-up. At the end or interruption of treatment, the records are anonymized, without the code, and used only for statistics and medical research. If you prefer deletion, ask the office.','<b>5. Durée et usage statistique.</b> Le consentement est valable pendant le suivi. À la fin ou à l’interruption du traitement, les enregistrements sont anonymisés, sans le code, et utilisés uniquement pour des statistiques et la recherche médicale. Si vous préférez la suppression, demandez-la au cabinet.'],
'ob.t6':['<b>6.</b> Os registros são analisados pelo médico nas avaliações, e não em tempo real.','<b>6.</b> The records are reviewed by the doctor during evaluations, not in real time.','<b>6.</b> Les enregistrements sont examinés par le médecin lors des évaluations, et non en temps réel.'],

'ob.agree':['Sou responsável legal pela criança, li o termo e <b>consinto</b>.','I am the child’s legal guardian, I have read the form and I <b>consent</b>.','Je suis le représentant légal de l’enfant, j’ai lu le formulaire et je <b>consens</b>.'],
'ob.assent':['Entendi e concordo em participar.','I understand and agree to take part.','J’ai compris et j’accepte de participer.'],
'ob.assenth':['Seus responsáveis só veem “preenchido ✔”. Se achar que eles devem ver como estão as suas noites, você ativa essa opção no menu, quando quiser.','Your guardians only see “done ✔”. If you decide they should see how your nights are going, you can turn this on in the menu at any time.','Vos responsables voient seulement « rempli ✔ ». Si vous pensez qu’ils doivent voir comment se passent vos nuits, vous pouvez activer cette option dans le menu quand vous voulez.'],

'dx.phase':['Fase de avaliação','Evaluation stage','Phase d’évaluation'],
'dx.intro':['Vocês estão na <b>fase de avaliação</b> (investigação). Para que o Dr. Domingos possa concluir o diagnóstico e definir o tratamento, precisamos das informações abaixo. As outras funções do aplicativo são liberadas quando o tratamento começar.','You are in the <b>evaluation stage</b>. So that Dr. Domingos can reach a diagnosis and define the treatment, we need the information below. The other features of the app unlock when treatment starts.','Vous êtes en <b>phase d’évaluation</b>. Pour que le Dr Domingos puisse conclure le diagnostic et définir le traitement, nous avons besoin des informations ci-dessous. Les autres fonctions de l’application se débloquent au début du traitement.'],

'dx.asked1':['O Dr. Domingos pediu <b>1</b> diário miccional.','Dr. Domingos asked for <b>1</b> voiding diary.','Le Dr Domingos a demandé <b>1</b> journal mictionnel.'],
'dx.askedn':['O Dr. Domingos pediu <b>{0}</b> diários miccionais, cada um em um dia diferente, sem dias seguidos.','Dr. Domingos asked for <b>{0}</b> voiding diaries, each on a different day, not on consecutive days.','Le Dr Domingos a demandé <b>{0}</b> journaux mictionnels, chacun un jour différent, sans jours consécutifs.'],

'dx.next':['Próximo dia indicado: <b>sábado {0}</b> (ou feriado), em casa, sem atividades externas.','Suggested next day: <b>Saturday {0}</b> (or a holiday), at home, with no outside activities.','Prochain jour conseillé : <b>samedi {0}</b> (ou jour férié), à la maison, sans activités extérieures.'],

'dx.how':['Como preencher o diário','How to fill in the diary','Comment remplir le journal'],
'dx.h1':['Escolha um sábado, domingo ou feriado em que a criança fique em casa.','Choose a Saturday, Sunday or holiday when the child stays at home.','Choisissez un samedi, un dimanche ou un jour férié où l’enfant reste à la maison.'],
'dx.h2':['<b>Nenhuma micção pode ficar sem registro.</b> Toque em “Registrar micção agora” a cada xixi.','<b>No urination may go unrecorded.</b> Tap “Record urination now” every time.','<b>Aucune miction ne doit rester sans enregistrement.</b> Touchez « Enregistrer une miction » à chaque pipi.'],
'dx.h3':['Meça o volume em um copo graduado e anote em mL.','Measure the volume in a measuring cup and write it down in mL.','Mesurez le volume dans un gobelet gradué et notez-le en mL.'],
'dx.h4':['<b>Neste dia, não peça nem lembre a criança de fazer xixi.</b> Ela deve urinar sozinha, quando sentir vontade. Só neste dia é proibido estimular. Você só anota.','<b>On this day, do not ask or remind the child to pee.</b> The child should go alone, when they feel the need. Only on this day, prompting is not allowed. You only write it down.','<b>Ce jour-là, ne demandez pas à l’enfant d’aller faire pipi et ne le lui rappelez pas.</b> Il doit uriner seul, quand il en ressent le besoin. Seulement ce jour-là, il est interdit de l’y inciter. Vous notez simplement.'],
'dx.h5':['Mantenha o dia comum e a ingestão de líquidos habitual: <b>nem menos, nem mais</b> que o normal.','Keep the day ordinary and fluid intake usual: <b>neither less nor more</b> than normal.','Gardez une journée ordinaire et une consommation de liquides habituelle : <b>ni moins, ni plus</b> que d’habitude.'],
'dx.h6':['Anote <b>tudo</b> que a criança beber durante o dia (água, suco, leite, sopa). O horário é opcional.','Write down <b>everything</b> the child drinks during the day (water, juice, milk, soup). The time is optional.','Notez <b>tout</b> ce que l’enfant boit pendant la journée (eau, jus, lait, soupe). L’heure est facultative.'],
'dx.h7a':['Na noite do diário, coloque uma fralda e pese de manhã. Meça o primeiro xixi do dia seguinte.','On the night of the diary, put on a diaper and weigh it in the morning. Measure the first pee of the next day.','La nuit du journal, mettez une couche et pesez-la le matin. Mesurez la première miction du lendemain.'],
'dx.h7b':['O dia do diário vai do acordar até a criança dormir. Não é preciso pesar fralda.','The diary day runs from waking up until the child goes to sleep. There is no need to weigh a diaper.','La journée du journal va du réveil jusqu’au coucher de l’enfant. Inutile de peser la couche.'],
'dx.n1':['O envio é automático. Cada registro vai para o Dr. Domingos assim que a internet estiver disponível.','Sending is automatic. Each record goes to Dr. Domingos as soon as there is internet.','L’envoi est automatique. Chaque enregistrement part vers le Dr Domingos dès qu’internet est disponible.'],
'dx.n2':['Exames e laudos não precisam ser enviados pelo aplicativo. Entregue no consultório, e o Dr. Domingos lança as informações.','Exams and reports do not need to be sent through the app. Bring them to the office, and Dr. Domingos will enter the information.','Les examens et comptes rendus n’ont pas besoin d’être envoyés par l’application. Apportez-les au cabinet, et le Dr Domingos saisira les informations.'],

'lt.m0':['Cada registro ajuda o Dr. Domingos a ajustar o tratamento no momento certo.','Every entry helps Dr. Domingos adjust the treatment at the right time.','Chaque enregistrement aide le Dr Domingos à ajuster le traitement au bon moment.'],
'lt.m1':['Registrar todos os dias é o que mais aumenta a chance de sucesso do tratamento.','Recording every day is what most increases the chance of treatment success.','Enregistrer chaque jour est ce qui augmente le plus les chances de réussite du traitement.'],
'lt.m2':['Sem os registros, a consulta vira palpite. Com eles, vira decisão.','Without records, the visit is guesswork. With them, it becomes a decision.','Sans enregistrements, la consultation repose sur des suppositions. Avec eux, elle devient une décision.'],

'ck.t':['A consulta do tratamento está chegando ao prazo','The treatment visit is reaching its deadline','La consultation du traitement atteint son échéance'],
'ck.p':['A data prevista da consulta foi há {0} dias. As consultas fazem parte do tratamento: é nelas que ajustamos a medicação e os cuidados de comportamento. Para não pausarmos o acompanhamento, conte-nos como estão as coisas. Faltam {1} dias para a pausa.','The expected visit date was {0} days ago. Visits are part of the treatment: that is where we adjust medication and behavioral care. To avoid pausing the follow-up, please tell us how things are. {1} days left before the pause.','La date prévue de la consultation était il y a {0} jours. Les consultations font partie du traitement : c’est là que nous ajustons les médicaments et les soins comportementaux. Pour éviter de mettre le suivi en pause, dites-nous où vous en êtes. Il reste {1} jours avant la pause.'],

'ck.r.vou':['Combinado! Ligue para o consultório assim que puder e informe a data aqui.','Agreed! Please call the office as soon as you can and enter the date here.','Entendu ! Appelez le cabinet dès que possible et indiquez la date ici.'],
'ck.r.melhorou':['Que boa notícia! Mesmo com a melhora, as consultas continuam importantes: a medicação costuma precisar de redução cuidadosa e os ajustes de comportamento são metade do sucesso. O Dr. Domingos será informado.','Great news! Even with improvement, visits remain important: medication usually needs careful tapering and behavioral adjustments are half of the success. Dr. Domingos will be informed.','Bonne nouvelle ! Même avec l’amélioration, les consultations restent importantes : le médicament doit souvent être réduit avec soin et les ajustements de comportement font la moitié du succès. Le Dr Domingos sera informé.'],
'ck.r.custo':['Obrigado por contar. O Dr. Domingos prefere saber da dificuldade para buscar uma solução junto com vocês. Fale com o consultório.','Thank you for telling us. Dr. Domingos prefers to know about the difficulty so a solution can be found together. Please contact the office.','Merci de nous le dire. Le Dr Domingos préfère connaître la difficulté pour chercher une solution avec vous. Contactez le cabinet.'],
'ck.r.parou':['Obrigado por nos contar. O Dr. Domingos será informado. Se mudarem de ideia, é só tocar em Retomar. Os registros ficam guardados.','Thank you for telling us. Dr. Domingos will be informed. If you change your mind, just tap Resume. Your records stay saved.','Merci de nous le dire. Le Dr Domingos sera informé. Si vous changez d’avis, touchez simplement Reprendre. Vos enregistrements restent conservés.'],
'ck.r.outro':['Obrigado por avisar. O Dr. Domingos será informado.','Thank you for letting us know. Dr. Domingos will be informed.','Merci de nous prévenir. Le Dr Domingos sera informé.'],

'ps.p':['O sucesso do tratamento depende da medicação e dos ajustes de comportamento, e ambos precisam de reavaliação periódica. A consulta prevista para {0} não foi realizada. Para continuarmos juntos, marque a consulta e informe a data aqui.','Treatment success depends on medication and behavioral adjustments, and both need periodic re-evaluation. The visit expected on {0} did not take place. To continue together, please book the visit and enter the date here.','Le succès du traitement dépend des médicaments et des ajustements de comportement, et les deux nécessitent une réévaluation périodique. La consultation prévue le {0} n’a pas eu lieu. Pour continuer ensemble, prenez rendez-vous et indiquez la date ici.'],
'ps.rec':['Calendário e resumo semanal ficam bloqueados até lá. Seus registros estão guardados.','The calendar and weekly summary stay locked until then. Your records are saved.','Le calendrier et le résumé hebdomadaire restent verrouillés jusque-là. Vos enregistrements sont conservés.'],
'st.t':['Tratamento prescrito','Treatment prescribed','Traitement prescrit'],
'st.lead':['Quando o tratamento começar, informe a data abaixo. Só depois disso o calendário e os controles são liberados.','When the treatment starts, enter the date below. The calendar and controls unlock only after that.','Lorsque le traitement commence, indiquez la date ci-dessous. Le calendrier et les contrôles ne se débloquent qu’ensuite.'],
'st.date':['Data em que o tratamento começou','Date the treatment started','Date de début du traitement'],
'st.ch':['Ritmo das consultas','Visit schedule','Rythme des consultations'],
'st.cp':['Em geral, o tratamento dos distúrbios da micção segue um ritmo de reavaliação: a primeira consulta cerca de 30 dias após o início, as três seguintes a cada 45 dias e, depois, a cada 2 meses, ou antes se o Dr. Domingos indicar. É esse acompanhamento próximo, com ajustes da medicação e dos hábitos no momento certo, que dá ao tratamento a melhor chance de evolução favorável. Se a consulta passar da data prevista em mais de 1 a 2 semanas, o acompanhamento no aplicativo fica em pausa até a consulta ser marcada.','In general, treating voiding disorders follows a rhythm of reassessment: the first visit about 30 days after starting, the next three every 45 days and then every 2 months, or sooner if Dr. Domingos advises. This close follow-up, adjusting medication and habits at the right time, gives the treatment its best chance of a favorable outcome. If a visit goes more than 1 to 2 weeks past the expected date, follow-up in the app is paused until the visit is booked.','En général, le traitement des troubles mictionnels suit un rythme de réévaluation : la première consultation environ 30 jours après le début, les trois suivantes tous les 45 jours, puis tous les 2 mois, ou plus tôt si le Dr Domingos l’indique. C’est ce suivi rapproché, avec des ajustements des médicaments et des habitudes au bon moment, qui donne au traitement les meilleures chances d’évolution favorable. Si une consultation dépasse la date prévue de plus de 1 à 2 semaines, le suivi dans l’application est mis en pause jusqu’à la prise de rendez-vous.'],

'cq.t.n14':['14 noites secas seguidas! 🎉','14 dry nights in a row! 🎉','14 nuits sèches de suite ! 🎉'],'cq.m.n14':['Parabéns à criança e a vocês. Sigam firmes.','Congratulations to your child and to you. Keep going.','Félicitations à l’enfant et à vous. Continuez ainsi.'],

'cq.t.apoio':['Você não está sozinho','You are not alone','Vous n’êtes pas seuls'],'cq.m.apoio':['No começo é comum a resposta demorar um pouco, na maior parte das crianças. O que mais importa é persistir. O Dr. Domingos vê tudo na consulta.','At the beginning it is common for the response to take a while, in most children. What matters most is persistence. Dr. Domingos reviews everything at the visit.','Au début, il est fréquent que la réponse tarde un peu, chez la plupart des enfants. Le plus important est de persévérer. Le Dr Domingos examine tout lors de la consultation.'],

'dv.ws':['Wet-Stop · alarme da noite (xixi na cama)','Wet-Stop · night alarm (bedwetting)','Wet-Stop · alarme de nuit (pipi au lit)'],
'dv.wst':['Um sensor avisa, com som ou vibração, nos primeiros pingos de xixi. Ele ajuda a criança a aprender a acordar quando a bexiga pede.','A sensor alerts, with sound or vibration, at the first drops of pee. It helps the child learn to wake up when the bladder asks.','Un capteur prévient, par un son ou une vibration, dès les premières gouttes. Il aide l’enfant à apprendre à se réveiller quand la vessie le demande.'],
'dv.ws1':['Use todas as noites e teste o aparelho antes de dormir.','Use it every night and test the device before bed.','Utilisez-le toutes les nuits et testez l’appareil avant de dormir.'],
'dv.ws2':['Quando tocar, a criança acorda, desliga, vai ao banheiro e troca a roupa. No começo, os adultos ajudam a acordar.','When it rings, the child wakes up, turns it off, goes to the bathroom and changes clothes. At first, adults help wake the child.','Quand il sonne, l’enfant se réveille, l’éteint, va aux toilettes et change de vêtements. Au début, les adultes aident à le réveiller.'],
'dv.ws3':['<b>Anote no calendário o que aconteceu:</b> se o alarme acordou a criança nas primeiras gotas e a cama ficou seca, ou se ela molhou a cama e não acordou com o alarme. Essa informação orienta o tratamento.','<b>Record in the calendar what happened:</b> whether the alarm woke the child at the first drops and the bed stayed dry, or the child wet the bed and did not wake up. This guides the treatment.','<b>Notez dans le calendrier ce qui s’est passé :</b> si l’alarme a réveillé l’enfant dès les premières gouttes et le lit est resté sec, ou si l’enfant a mouillé le lit sans se réveiller. Cette information guide le traitement.'],
'dv.ws4':['O Dr. Domingos decide quando parar. Não interrompa por conta própria.','Dr. Domingos decides when to stop. Do not stop on your own.','Le Dr Domingos décide quand arrêter. N’arrêtez pas de vous-même.'],
'dv.wb':['WobL · relógio do “xixi legal” (de dia)','WobL · the “pee on time” watch (daytime)','WobL · la montre du « pipi à l’heure » (en journée)'],
'dv.wbt':['O relógio vibra ou toca em horários regulares e ajuda a criança a lembrar de urinar, sem que os pais precisem ficar pedindo. Faz parte do programa de micção em horários (“xixi legal”).','The watch vibrates or rings at regular times and helps the child remember to pee, without parents having to keep asking. It is part of the timed voiding program (“pee on time”).','La montre vibre ou sonne à heures régulières et aide l’enfant à penser à uriner, sans que les parents aient à le rappeler. Elle fait partie du programme de mictions à heures fixes (« pipi à l’heure »).'],
'dv.wb1':['<b>De manhã:</b> enquanto a criança estiver bebendo bastante líquido, programe o intervalo entre 1 hora e 1h30.','<b>Morning:</b> while the child is drinking plenty of fluids, set the interval between 1 hour and 1h30.','<b>Le matin :</b> tant que l’enfant boit beaucoup, réglez l’intervalle entre 1 heure et 1h30.'],
'dv.wb2':['<b>À tarde:</b> intervalo entre 1h30 e 2 horas, ajustando aos horários de almoço, lanche, chegada à escola e outras rotinas.','<b>Afternoon:</b> interval between 1h30 and 2 hours, adjusted to lunch, snack, arrival at school and other routines.','<b>L’après-midi :</b> intervalle entre 1h30 et 2 heures, adapté au déjeuner, au goûter, à l’arrivée à l’école et aux autres routines.'],
'dv.wb3':['<b>A criança pode e deve fazer xixi quando sentir vontade.</b> Ela não deve esperar o relógio tocar ou vibrar para ir ao banheiro.','<b>The child can and should pee whenever they feel the urge.</b> They should not wait for the watch to ring or vibrate.','<b>L’enfant peut et doit uriner dès qu’il en ressent le besoin.</b> Il ne doit pas attendre que la montre sonne ou vibre.'],
'dv.wb4':['Se ela não urinou nos 30 minutos antes do alarme, deve ir ao banheiro quando o relógio tocar ou vibrar.','If the child has not peed in the 30 minutes before the alarm, they should go to the bathroom when the watch rings or vibrates.','S’il n’a pas uriné dans les 30 minutes avant l’alarme, l’enfant doit aller aux toilettes quand la montre sonne ou vibre.'],
'dv.wb5':['<b>No dia do diário miccional, não use.</b> Nesse dia a criança vai sozinha, sem lembretes.','<b>On the voiding diary day, do not use it.</b> On that day the child goes alone, without reminders.','<b>Le jour du journal mictionnel, ne l’utilisez pas.</b> Ce jour-là, l’enfant y va seul, sans rappel.'],

'cal.t1':['<b>É importante que a criança preencha a parte dela.</b> Esse envolvimento é fundamental para o sucesso do tratamento.','<b>It is important that the child fills in their own part.</b> This involvement is essential to treatment success.','<b>Il est important que l’enfant remplisse sa propre partie.</b> Cet engagement est essentiel à la réussite du traitement.'],
'cal.t2':['Incentivem cada sol conquistado.','Celebrate every sun earned.','Encouragez chaque soleil obtenu.'],
'cal.t3':['Se houve uma noite molhada por alguma falha (excesso de líquidos, dormiu tarde, ar-condicionado…), conversem com a criança sobre o quanto isso é importante nesta fase do tratamento.','If there was a wet night because of a slip (too many fluids, late bedtime, air conditioning…), talk with the child about how important this is at this stage of the treatment.','S’il y a eu une nuit mouillée à cause d’un écart (trop de liquide, coucher tardif, climatisation…), parlez avec l’enfant de l’importance de cette phase du traitement.'],
'cal.t4':['Depois, tudo vai se normalizar.','Afterwards, everything will normalize.','Ensuite, tout rentrera dans l’ordre.'],

'mn.shareon':['Ativado: seus responsáveis veem como foram as suas noites. Você pode desativar quando quiser.','On: your guardians can see how your nights went. You can turn it off whenever you like.','Activé : vos responsables voient comment se sont passées vos nuits. Vous pouvez le désactiver quand vous voulez.'],
'mn.shareoff':['Desativado: seus responsáveis veem apenas “preenchido ✔”. Ative esta opção quando achar que eles devem ver como estão as suas noites.','Off: your guardians only see “done ✔”. Turn this on when you feel they should see how your nights are going.','Désactivé : vos responsables voient seulement « rempli ✔ ». Activez cette option quand vous pensez qu’ils doivent voir comment se passent vos nuits.'],

'in.title':['Orientações','Guidance','Conseils'],'in.note':['Texto de exemplo para revisão do Dr. Domingos. As orientações completas continuam sendo enviadas em PDF pelo consultório.','Sample text for Dr. Domingos to review. The full guidance is still sent as a PDF by the office.','Texte d’exemple à relire par le Dr Domingos. Les conseils complets continuent d’être envoyés en PDF par le cabinet.'],
'in.how':['Como fazer o diário miccional','How to do the voiding diary','Comment faire le journal mictionnel'],
'in.1':['Escolha um sábado, domingo ou feriado, em casa, sem atividades externas.','Choose a Saturday, Sunday or holiday, at home, with no outside activities.','Choisissez un samedi, un dimanche ou un jour férié, à la maison, sans activités extérieures.'],
'in.2':['<b>Neste dia, não peça nem lembre a criança de fazer xixi.</b> Ela vai sozinha, quando sentir vontade. Você só anota.','<b>On this day, do not ask or remind the child to pee.</b> The child goes alone, when they feel the need. You only write it down.','<b>Ce jour-là, ne demandez pas à l’enfant d’aller faire pipi et ne le lui rappelez pas.</b> Il y va seul, quand il en ressent le besoin. Vous notez simplement.'],
'in.3':['Mantenha a ingestão de líquidos habitual: <b>nem menos, nem mais</b> que o normal.','Keep fluid intake usual: <b>neither less nor more</b> than normal.','Gardez une consommation de liquides habituelle : <b>ni moins, ni plus</b> que d’habitude.'],
'in.4':['Anote cada micção (volume, urgência, perdas) e tudo que a criança beber. O horário dos líquidos é opcional.','Record every urination (volume, urgency, leaks) and everything the child drinks. The time of drinks is optional.','Notez chaque miction (volume, urgence, fuites) et tout ce que l’enfant boit. L’heure des boissons est facultative.'],
'in.5':['<b>Diário inicial, se há xixi na cama:</b> na noite do diário, coloque fralda e pese de manhã. Meça também o primeiro xixi do dia seguinte.','<b>Initial diary, if there is bedwetting:</b> on the night of the diary, put on a diaper and weigh it in the morning. Also measure the first pee of the next day.','<b>Journal initial, en cas de pipi au lit :</b> la nuit du journal, mettez une couche et pesez-la le matin. Mesurez aussi la première miction du lendemain.'],
'in.6':['<b>Diário de acompanhamento:</b> vai do acordar até a criança dormir, sem fralda.','<b>Follow-up diary:</b> runs from waking up until the child goes to sleep, without a diaper.','<b>Journal de suivi :</b> du réveil jusqu’au coucher de l’enfant, sans couche.'],
'in.other':['Nos outros dias','On other days','Les autres jours'],
'in.o1':['É recomendado lembrar a criança de urinar em horários regulares. Os pais podem pedir, ou ela pode usar um relógio ou dispositivo com alarme.','It is recommended to remind the child to pee at regular times. Parents can ask, or the child can use a watch or device with an alarm.','Il est recommandé de rappeler à l’enfant d’uriner à heures régulières. Les parents peuvent le demander, ou l’enfant peut utiliser une montre ou un appareil avec alarme.'],
'in.o2':['No calendário do xixi, <b>a criança escolhe o desenho</b> de como foi a noite. Os adultos completam o remédio e as observações.','In the pee calendar, <b>the child picks the picture</b> for how the night went. Adults fill in the medication and notes.','Dans le calendrier pipi, <b>l’enfant choisit le dessin</b> de la nuit. Les adultes complètent le médicament et les remarques.'],
'in.liq':['Líquidos ao longo do dia','Fluids through the day','Liquides au cours de la journée'],'in.liqh':['A distribuição importa tanto quanto a quantidade.','The distribution matters as much as the amount.','La répartition compte autant que la quantité.'],

'in.hab':['Hábitos','Habits','Habitudes'],'in.h1':['Urinar em horários regulares, cerca de 8 vezes por dia (fora do dia do diário).','Pee at regular times, about 8 times a day (except on diary day).','Uriner à heures régulières, environ 8 fois par jour (hors jour du journal).'],

/* como usar */
'hp.title':['Como usar o aplicativo','How to use the app','Mode d’emploi de l’application'],'hp.why':['Para que serve','What it is for','À quoi ça sert'],
'hp.whyt':['É uma forma de oferecer um tratamento melhor, com mais visibilidade do que acontece com a criança entre as consultas e do efeito de cada mudança de conduta. Os registros são analisados pelo Dr. Domingos nas consultas, e não em tempo real. <b>Não use o aplicativo para urgências.</b>','It is a way to offer better treatment, with more visibility into what happens to the child between visits and into the effect of each change in treatment. The records are reviewed by Dr. Domingos at the visits, not in real time. <b>Do not use the app for emergencies.</b>','C’est un moyen d’offrir un meilleur traitement, avec plus de visibilité sur ce qui se passe entre les consultations et sur l’effet de chaque changement de prise en charge. Les enregistrements sont examinés par le Dr Domingos lors des consultations, et non en temps réel. <b>N’utilisez pas l’application pour les urgences.</b>'],
'hp.steps':['Passo a passo','Step by step','Pas à pas'],
'hp.s1':['Todo dia de manhã, a criança diz como foi a noite e o calendário recebe o símbolo.','Every morning, the child says how the night went and the calendar gets the symbol.','Chaque matin, l’enfant dit comment s’est passée la nuit et le calendrier reçoit le symbole.'],
'hp.s2':['Toda semana, os pais respondem o resumo (cerca de 1 minuto).','Every week, parents answer the summary (about 1 minute).','Chaque semaine, les parents remplissent le résumé (environ 1 minute).'],
'hp.s3':['Quando o Dr. Domingos pedir um diário miccional, ele aparece no menu com o prazo.','When Dr. Domingos asks for a voiding diary, it appears in the menu with the deadline.','Lorsque le Dr Domingos demande un journal mictionnel, il apparaît dans le menu avec le délai.'],

/* para onde o app deve ir conforme a configuração do paciente */
function fixScreen(){
 const c=S.cfg;if(!c){S.p.screen='onb';return}
 const sc=S.p.screen;
 if((c.fase==='trat'&&c.status!=='ativo')||c.status==='encerrado'){S.p.screen='wait';return}
 if(needStart()){if(!['start','info','help'].includes(sc))S.p.screen='start';return}
 if(pauseInfo()){if(!['pause','info','help'].includes(sc))S.p.screen='pause';return}
 if(sc==='start'||sc==='pause')S.p.screen='menu';
 if(sc==='wait'||sc==='onb'||sc==='load')S.p.screen=(c.fase==='inv'&&c.dx)?'dx':'menu';
 if(c.fase==='inv'&&c.dx&&(sc==='menu'))S.p.screen='dx';
 if(c.fase==='trat'&&(sc==='dx')&&!S.dx.ativo)S.p.screen='menu';
 if(!S.p.inst&&instNeeded()&&['wait','onb','load'].includes(sc)&&['menu','dx'].includes(S.p.screen))S.p.screen='inst';
}
/* ---------- rede ---------- */
async function api(req){
 if(!API_URL||API_URL.indexOf('COLE')>=0)return{ok:false,err:'config'};
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),30000);
 try{
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(req),redirect:'follow',signal:ctl.signal});
  return await r.json();
 }catch(e){return{ok:false,err:'rede'}}finally{clearTimeout(tm)}
}
function queue(a,d){S.outbox.push({eid:uid(),a:a,d:d});save();flush()}
let flushing=false;
async function flush(){
 if(flushing||!S.token||!S.outbox.length||S.authBad)return;
 if(navigator.onLine===false)return;
 flushing=true;
 try{
  for(let guard=0;guard<20&&S.outbox.length;guard++){
   const batch=S.outbox.slice(0,40);
   const r=await api({a:'sync',c:S.code,t:S.token,e:batch});
   if(r.ok){
    const gone=new Set((r.done||[]).concat(r.bad||[]));
    S.outbox=S.outbox.filter(e=>!gone.has(e.eid));
    if(r.config)applyCfg(r.config);
    save();render();
   }else{if(r.err==='auth'){S.authBad=true;save();render()}break}
  }
 }finally{flushing=false}
}
async function refresh(){
 if(!S.token)return;
 const r=await api({a:'config',c:S.code,t:S.token});
 if(r.ok){applyCfg(r.config);cqCheck();save()}else if(r.err==='auth'){S.authBad=true}
 render();flush();
}

 const ae=document.activeElement,fk=ae&&ae.dataset&&ae.dataset.i?{k:ae.dataset.i,s:ae.selectionStart}:null;

 if(fk){const el=document.querySelector('[data-i="'+fk.k+'"]');if(el){el.focus();try{el.setSelectionRange(fk.s,fk.s)}catch(e){}}}
}
const toTop=()=>window.scrollTo(0,0);
function openNight(k){
 const n=S.nights[k];
 S.draft=n?{s:n.s,f:n.f.filter(x=>x!=='med'),por:n.por,al:n.al||'',rem:n.f.includes('med')?'nao':(n.rem||'sim'),who:n.who||(n.h==='P'?'pai':(S.papel==='pai'?'pai':'mae'))}:Object.assign(draftBlank(),{who:S.papel==='pai'?'pai':(S.papel==='mae'?'mae':'')});
 if(S.p.adol)S.draft.who='adol';
 S.p.sheet={v:'night',k,step:1};
}
function cqAch(){
 const a=[],ks=Object.keys(S.nights).sort(),dry=k=>S.nights[k]&&S.nights[k].s==='seca';
 if(hasMod('n')){
  if(ks.some(dry))a.push('n1');
  let run=0,best=0,prev=null;ks.forEach(k=>{if(dry(k)){run=(prev&&dry(prev)&&diff(P(k),P(prev))===1)?run+1:1;best=Math.max(best,run)}else run=0;prev=k});
  if(best>=7)a.push('n7');if(best>=14)a.push('n14');
  const w=ks.filter(k=>{const d=diff(TODAY,P(k));return d>=0&&d<28});
  if(w.length>=14){const f=w.filter(dry).length/w.length;if(f>=.5)a.push('p50');if(f>=.8)a.push('p80')}
  const w2=ks.filter(k=>{const d=diff(TODAY,P(k));return d>=0&&d<21});
  if(S.cfg&&S.cfg.inicio&&diff(TODAY,P(S.cfg.inicio))>=21&&w2.length>=14&&w2.filter(dry).length/w2.length<=.1)a.push('apoio');
 }
 if(hasMod('d')){const wk=Object.keys(S.weeks).sort(),z=k=>S.weeks[k]&&S.weeks[k].esc===0;
  if(wk.some(z))a.push('d1');
  if(wk.some((k,i)=>i>0&&z(k)&&z(wk[i-1])&&diff(P(k),P(wk[i-1]))===7))a.push('d2')}
 return a;
}
function cqCheck(){
 if(!S.token)return;const a=cqAch();
 if(S.p.cq===undefined){S.p.cq=a.slice();return}
 const nw=a.filter(k=>!S.p.cq.includes(k));if(!nw.length)return;
 [['n1','n7','n14','p50','p80'],['d1','d2'],['apoio']].forEach(g=>{const hit=g.filter(k=>nw.includes(k));if(!hit.length)return;
  g.forEach(k=>{if(a.includes(k)&&!S.p.cq.includes(k))S.p.cq.push(k)});
  const best=hit[hit.length-1];queue('conq',{k:best});S.p.cqs=best});
 save();
}

  }

  applyCfg(r.config);save();toTop();
 },

  else S.p.sheet={v:'rule'}},

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
 const fn=A[el.dataset.a];if(!fn)return;
 if(el.classList.contains('sheetbg')&&e.target!==el)return;
 const r=fn(el.dataset,e);
 if(r&&typeof r.then==='function'){r.then(x=>{if(x!=='norender')render()});return}
 if(r==='norender')return;
 render();
});
function onField(e){
 const el=e.target;
 if(el.dataset.i){set(el.dataset.i,el.value);if(el.dataset.i==='ob.code'||el.dataset.i==='ob.dob'){S.ob.err=''}
  const u=el.dataset.u;
  if(u==='ob'){const g=document.getElementById('ob-go');if(g)g.disabled=!obValid()||S.ob.busy;const n=document.getElementById('ob-norm');if(n)n.innerHTML=obNormHtml()}
  save();
 }
 if(el.dataset.c&&e.type==='change'){
  set(el.dataset.c,el.checked);
  if(el.dataset.c==='p.share')queue('share',{v:el.checked});
  save();render();
 }
}
